version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:./prisma/dev.db
      - JWT_SECRET=ab438f88c83bb37452d9a3b8388ff923984e72797e88efecbda9b9de3ef5871f
      - NODE_ENV=production
    volumes:
      - backend-db:/app/prisma

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-db:
